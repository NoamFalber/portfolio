<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>Unity Web Player | Surreal Landscape Prototype</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="0"></canvas>
      <div id="unity-loading-bar" role="status" aria-live="polite">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning" aria-live="assertive"></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <button id="unity-fullscreen-button" type="button" aria-label="Enter fullscreen"></button>
        <div id="unity-build-title">Surreal Landscape Prototype</div>
      </div>
    </div>
    <script>
      "use strict";

      const canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        const warningBanner = document.querySelector("#unity-warning");

        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        const div = document.createElement("div");
        div.className = `unity-message unity-message--${type || "info"}`;
        div.textContent = msg;
        warningBanner.appendChild(div);

        if (type !== "error") {
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/game-one-webgpu-20260810-r2.loader.js";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/game-one-webgpu-20260810-r2.data.br",
        frameworkUrl: buildUrl + "/game-one-webgpu-20260810-r2.framework.js.br",
        codeUrl: buildUrl + "/game-one-webgpu-20260810-r2.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Noam",
        productName: "Surreal Landscape Prototype",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.head.appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      function reportBuildState(state) {
        if (window.parent !== window) {
          window.parent.postMessage(
            { type: "portfolio-unity-build", state: state },
            window.location.origin
          );
        }
      }

      function showBuildError(message) {
        document.querySelector("#unity-loading-bar").style.display = "none";
        reportBuildState("error");
        unityShowBanner(message, "error");
      }

      function requireWebGpuApi() {
        if (!window.isSecureContext) {
          throw new Error("This build requires WebGPU over a secure HTTPS connection.");
        }

        if (!navigator.gpu) {
          throw new Error("This build requires a browser and graphics driver with WebGPU enabled.");
        }
      }

      function loadUnityLoader() {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = resolve;
          script.onerror = () => reject(
            new Error("The game loader could not be downloaded. Please refresh and try again.")
          );
          document.body.appendChild(script);
        });
      }

      async function enterFullscreen(unityInstance) {
        const container = document.querySelector("#unity-container");
        const requestFullscreen =
          container.requestFullscreen ||
          container.webkitRequestFullscreen ||
          container.webkitRequestFullScreen ||
          container.msRequestFullscreen;

        if (requestFullscreen) {
          try {
            await Promise.resolve(requestFullscreen.call(container));
            canvas.focus();
            return;
          } catch (error) {
            console.warn("The browser fullscreen request failed; trying Unity fullscreen.", error);
          }
        }

        unityInstance.SetFullscreen(1);
      }

      async function startUnityBuild() {
        document.querySelector("#unity-loading-bar").style.display = "block";
        reportBuildState("loading");

        try {
          requireWebGpuApi();
          await loadUnityLoader();

          const unityInstance = await createUnityInstance(canvas, config, (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          });

          let webGpuContext = null;

          try {
            webGpuContext = canvas.getContext("webgpu");
          } catch (error) {
            console.error("Unable to verify the Unity WebGPU canvas context.", error);
          }

          if (!webGpuContext) {
            void unityInstance.Quit().catch(() => {});
            throw new Error("The game did not initialize with WebGPU, so it was stopped.");
          }

          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            void enterFullscreen(unityInstance);
          };

          reportBuildState("ready");
        } catch (error) {
          console.error(error);
          showBuildError(error instanceof Error ? error.message : String(error));
        }
      }

      startUnityBuild();

    </script>
  </body>
</html>
